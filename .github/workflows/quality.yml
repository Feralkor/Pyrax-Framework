name: Pyrax Framework Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - name: Bootstrap new-organization discovery smoke test
        run: pyrax bootstrap "Smoke Company" --archetype predictive-operations --destination /tmp
      - name: Validate production-ready framework fixture
        run: pyrax validate tests/fixtures/minimal-domain-pack.yaml
      - name: Validate hypothetical fine-tuning example
        run: pyrax validate examples/strategicos-hypothetical/domain-pack.yaml
      - name: Assess production-ready fixture
        run: pyrax assess tests/fixtures/minimal-domain-pack.yaml
      - name: Assess Pyrax maturity fixture
        run: pyrax maturity tests/fixtures/minimal-domain-pack.yaml
      - name: Inspect reusable profiles and catalogs
        run: |
          pyrax profiles fleet-intelligence
          pyrax catalog blocks
          pyrax catalog adapters
          pyrax catalog ui
      - name: Validate V0.5 reference manifests
        run: |
          pyrax manifest examples/v0.5-reference-compositions/route-engineer.solution.yaml
          pyrax manifest examples/v0.5-reference-compositions/asset-radar.solution.yaml
          pyrax manifest examples/v0.5-reference-compositions/predictive-maintenance.solution.yaml
          pyrax manifest examples/v0.5-reference-compositions/oee-intelligence.solution.yaml
          pyrax manifest examples/v0.5-reference-compositions/decision-engine.solution.yaml
      - name: Compose Domain Pack overlay smoke test
        run: pyrax compose tests/fixtures/minimal-domain-pack.yaml --overlay tests/fixtures/minimal-domain-pack.yaml --output /tmp/composed-domain-pack.yaml
      - name: Preset scaffold smoke test
        run: pyrax scaffold fleet-smoke --profile fleet-intelligence --domain-pack tests/fixtures/minimal-domain-pack.yaml --destination /tmp
      - name: Manifest scaffold smoke test
        run: pyrax scaffold decision-smoke --manifest examples/v0.5-reference-compositions/decision-engine.solution.yaml --domain-pack tests/fixtures/minimal-domain-pack.yaml --destination /tmp

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
