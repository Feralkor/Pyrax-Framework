name: Pyrax Framework Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - name: Validate production-ready framework fixture
        run: pyrax validate tests/fixtures/minimal-domain-pack.yaml
      - name: Validate hypothetical fine-tuning example
        run: pyrax validate examples/strategicos-hypothetical/domain-pack.yaml
      - name: Assess production-ready fixture
        run: pyrax assess tests/fixtures/minimal-domain-pack.yaml
      - name: Scaffold smoke test
        run: pyrax scaffold smoke-solution --domain-pack tests/fixtures/minimal-domain-pack.yaml --destination /tmp

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
